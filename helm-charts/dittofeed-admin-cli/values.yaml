# Default values for dittofeed.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

workspaceName: Dittofeed

replicaCount: 1

image:
  repository: dittofeed/dittofeed-admin-cli
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

separateWorker:
  enabled: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  # Recommended resources for production
  limits:
    cpu: 2
    memory: 2048Mi
  requests:
    cpu: 1
    memory: 512Mi
env:
  - name: DATABASE_HOST
    value: "postgresql-dittofeed-cluster.dittofeed.svc.cluster.local"
  - name: DATABASE_USER
    value: "dittofeed"
  - name: DATABASE_PASSWORD
    value: "732mP88xjGK993rK4eroND1j545AejcGJ4TXgW1oB6OgRMTNUkQfjS4YBCsIAGha"
  ## - name: DATABASE_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-pg-secret-name
  #       key: password
  - name: CLICKHOUSE_HOST
    value: "http://clickhouse-clickhouse-dittofeed.dittofeed.svc.cluster.local:8123"
  - name: CLICKHOUSE_USER
    value: "dittofeed"
  - name: CLICKHOUSE_PASSWORD
    value: "4et5sry6dt7ry8fkcgfthrdges4t5r6"
  # - name: CLICKHOUSE_PASSWORD
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-clickhouse-secret-name
  #       key: password
  # BOOTSTRAP should be set to "false" after the first deployment
  - name: BOOTSTRAP
    value: "false"
  - name: BOOTSTRAP_SAFE
    value: "false"
  - name: TEMPORAL_ADDRESS
    value: "dittofeed-temporal-frontend.dittofeed.svc.cluster.local:7233"
  - name: AUTH_MODE
    value: "single-tenant"   # уже выставляется chart'ом для lite
  - name: PASSWORD
    value: "NPV_mnw7yev*nkz-gra"   # или secretKeyRef
  - name: SECRET_KEY
    value: "EZODsa8imeuo1DeQ0kO6XykuYoE03fF6JFvoGZu2SUg="   # openssl rand -base64 32
  - name: SESSION_COOKIE_SECURE
    value: "true"
# the kafka host and portnames to write to
  - name: KAFKA_BROKERS
    value: "dittofeed-kafka-kafka-bootstrap:9092"
# the username and password to use for the kafka connection
  - name: KAFKA_USERNAME
    value: dittofeed
  - name: KAFKA_PASSWORD
    value: "ktv.XEF*abe1jzy!nkv"
# whether to use SSL for the kafka connection
  - name: KAFKA_SSL
    value: "false"
# the kafka sasl mechanism to use
# possible values are: plain, scram-sha-256, scram-sha-512
  - name: KAFKA_SASL_MECHANISM
    value: "scram-sha-512"
# the number of partitions to use for the user events topic when bootstrapping
  - name: KAFKA_USER_EVENTS_PARTITIONS
    value: "3"
# the replication factor to use for the user events topic when bootstrapping
  - name: KAFKA_USER_EVENTS_REPLICATION_FACTOR
    value: "3"
# the name of the user events topic to create when bootstrapping
  - name: USER_EVENTS_TOPIC_NAME
    value: dittofeed-user-events
  - name: DASHBOARD_URL
    value: https://dittofeed.hngcweywe.com