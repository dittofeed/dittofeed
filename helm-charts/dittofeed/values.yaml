# Default values for dittofeed.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ee:
  enabled: false

# This configuration disables the worker in our primary deployment, which then
# only runs the API and Dashboard. We then create separate worker deployments
# for each of the temporal queues utilized by Dittofeed.
separateWorker:
  enabled: true
  worker:
    image:
      repository: dittofeed/dittofeed-worker
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""

  # The default queue is used to process user journeys.
  default:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 1024Mi
  # The workspace queue is used to recompute workspaces' segments and user properties, and to process broadcasts.
  workspace:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 2048Mi
  # Is used to handle secondary scheduled workflows.
  global:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 1024Mi

workspaceName: Dittofeed
replicaCount: 3

maxOldSpaceSize: 4096

image:
  repository: dittofeed/dittofeed-lite
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  hosts:
    - host: dittofeed.hngcweywe.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: dittofeed-hngcweywe-com-tls
     hosts:
       - dittofeed.hngcweywe.com

ingress_public_api:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  hosts:
    - host: api-dt.hngcweywe.com
      paths:
        - path: /api/public/subscription-management/page
          pathType: Prefix
  tls:
   - secretName: api-dt-hngcweywe-com-tls
     hosts:
       - api-dt.hngcweywe.com
  dashboard_api_base: https://dittofeed.hngcweywe.com

resources:
  # Recommended resources for production
  limits:
    cpu: 8
    memory: 6Gi
  requests:
    cpu: 1
    memory: 512Mi

clickhouse:
  # Enable to install ClickHouse as a dependency
  enabled: false
  # Minimal installation for ease of testing.
  shards: 1
  replicaCount: 1
  zookeeper:
    enabled: false
  defaultConfigurationOverrides: |
    <clickhouse>
      <macros>
        <shard>1</shard>
        <replica>single</replica>
      </macros>
    </clickhouse>
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 1024Mi
  auth:
    username: dittofeed
    password: password
    database: dittofeed
    # uncomment to use an existing secret for the password
    # existingSecret: "my-clickhouse-secret-name"
    # existingSecretKey: "password"

postgresql:
  # Enable to install PostgreSQL as a dependency
  enabled: false
  auth:
    username: postgres
    password: password
    database: dittofeed
    # uncomment to use an existing secret for the password
    # existingSecret: "my-pg-secret-name"
    # userPasswordKey: "password"

temporal:
  # Enable to install standalone Temporal as a dependency
  enabled: false
  resources: {}
    # limits:
    #   cpu: 1
    #   memory: 1024Mi
    # requests:
    #   cpu: 1
    #   memory: 1024Mi
  env:
    - name: POSTGRES_SEEDS
      value: "demo-postgresql.default.svc.cluster.local"
    - name: POSTGRES_USER
      value: "postgres"
    - name: POSTGRES_PWD
      value: "password"

  image:
    repository: temporalio/auto-setup
    tag: 1.23.1.0
    pullPolicy: IfNotPresent

