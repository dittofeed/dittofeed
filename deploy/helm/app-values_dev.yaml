  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  hosts:
    - host: dittofeed-dev.hngcweywe.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
   - secretName: dittofeed-dev-hngcweywe-com-tls
     hosts:
       - dittofeed-dev.hngcweywe.com

ingress_public_api:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  hosts:
    - host: api-dt-dev.hngcweywe.com
      paths:
        - path: /api/public/subscription-management/page
          pathType: Prefix
  tls:
   - secretName: api-dt-hngcweywe-com-tls
     hosts:
       - api-dt-dev.hngcweywe.com
  dashboard_api_base: https://dittofeed-dev.hngcweywe.com

resources:
  # Recommended resources for production
  limits:
    cpu: 8
    memory: 6Gi
  requests:
    cpu: 1
    memory: 512Mi

clickhouse:
  # Enable to install ClickHouse as a dependency
  enabled: false
  # Minimal installation for ease of testing.
  shards: 1
  replicaCount: 1
  zookeeper:
    enabled: false
  defaultConfigurationOverrides: |
    <clickhouse>
      <macros>
        <shard>1</shard>
        <replica>single</replica>
      </macros>
    </clickhouse>
  resources:
    limits:
      memory: 1024Mi
    requests:
      memory: 1024Mi
  auth:
    username: dittofeed
    password: password
    database: dittofeed
    # uncomment to use an existing secret for the password
    # existingSecret: "my-clickhouse-secret-name"
    # existingSecretKey: "password"

postgresql:
  # Enable to install PostgreSQL as a dependency
  enabled: false
  auth:
    username: postgres
    password: password
    database: dittofeed
    # uncomment to use an existing secret for the password
    # existingSecret: "my-pg-secret-name"
    # userPasswordKey: "password"

