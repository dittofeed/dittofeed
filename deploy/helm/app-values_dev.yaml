# Default values for dittofeed.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ee:
  enabled: false

# This configuration disables the worker in our primary deployment, which then
# only runs the API and Dashboard. We then create separate worker deployments
# for each of the temporal queues utilized by Dittofeed.
separateWorker:
  enabled: true
  worker:
    image:
      repository: harbor.gbinfra.io/dittofeed/dittofeed-worker
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: "6bad241"

  # The default queue is used to process user journeys.
  default:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 1024Mi
  # The workspace queue is used to recompute workspaces' segments and user properties, and to process broadcasts.
  workspace:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 2048Mi
  # Is used to handle secondary scheduled workflows.
  global:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 1024Mi

  transactional:
    replicaCount: 3
    maxOldSpaceSize: 4096
    resources:
      limits:
        cpu: 8
        memory: 6Gi
      requests:
        cpu: 1
        memory: 1024Mi
    additional_env:
      - name: USER_JOURNEY_TASK_QUEUE
        value: "default"
      - name: TRANSACTIONAL_TASK_QUEUE
        value: "transactional"

workspaceName: Dittofeed
