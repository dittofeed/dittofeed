name: Dittofeed CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: prod
        type: choice
        options:
          - prod
          - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: dittofeed-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}
  cancel-in-progress: false

env:
  REGISTRY: harbor.gbinfra.io
  IMAGE_PREFIX: harbor.gbinfra.io/dittofeed

jobs:
  docker:
    name: Publish Docker image (${{ matrix.package }})
    runs-on: [self-hosted, standalone]
    strategy:
      fail-fast: false
      matrix:
        package:
          - worker
          - api
          - dashboard
          - admin-cli
          - lite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "${{ env.REGISTRY }}" \
            -u 'robot$github-actions' \
            --password-stdin

      - name: Build dittofeed-${{ matrix.package }} Docker image
        run: |
          docker build \
            -f ./packages/${{ matrix.package }}/Dockerfile \
            --build-arg APP_VERSION=$(echo $GITHUB_SHA | head -c7) \
            -t ${{ env.IMAGE_PREFIX }}/dittofeed-${{ matrix.package }}:$(echo $GITHUB_SHA | head -c7) \
            --push \
            .

  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }})
    needs: docker
    runs-on: [self-hosted, standalone]
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}
    env:
      VAULT_ADDR: https://vault.gbinfra.io
      VAULT_GITHUB_ROLE: ${{ secrets.VAULT_GITHUB_ROLE }}
      VAULT_GITHUB_AUDIENCE: ${{ secrets.VAULT_GITHUB_AUDIENCE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deployment target
        id: target
        run: |
          TARGET="${{ github.event_name == 'workflow_dispatch' && inputs.target || 'prod' }}"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          if [ "$TARGET" = "dev" ]; then
            echo "namespace=dittofeed-dev" >> "$GITHUB_OUTPUT"
            echo "admin_cli_values=deploy/helm-charts/dittofeed-admin-cli/values_dev.yaml" >> "$GITHUB_OUTPUT"
            echo "app_values=deploy/helm-charts/dittofeed/values_dev.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=dittofeed" >> "$GITHUB_OUTPUT"
            echo "admin_cli_values=" >> "$GITHUB_OUTPUT"
            echo "app_values=" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$(echo $GITHUB_SHA | head -c7)" >> "$GITHUB_OUTPUT"

      - name: Load kubeconfig from Vault
        id: kube
        uses: ./.github/actions/vault-load-kubeconfig

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup kubeconfig
        run: |
          export HOME="${HOME:-/root}"
          src="${{ steps.kube.outputs.kubeconfig_file }}"
          if [ ! -s "$src" ]; then
            echo "::error::kubeconfig file is missing or empty"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if head -1 "$src" | grep -q '^apiVersion:'; then
            cp "$src" "$HOME/.kube/config"
          else
            base64 -d < "$src" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          echo "KUBECONFIG=$HOME/.kube/config" >> "$GITHUB_ENV"
          kubectl cluster-info --request-timeout=15s

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Deploy admin-cli
        run: |
          set -euo pipefail
          args=(
            upgrade --install
            -n "${{ steps.target.outputs.namespace }}"
            dittofeed-admin-cli deploy/helm-charts/dittofeed-admin-cli
            --set "image.tag=${{ steps.target.outputs.tag }}"
            --wait --timeout 10m
          )
          if [ -n "${{ steps.target.outputs.admin_cli_values }}" ]; then
            args+=(-f "${{ steps.target.outputs.admin_cli_values }}")
          fi
          helm "${args[@]}"

      - name: Deploy dittofeed app
        run: |
          set -euo pipefail
          args=(
            upgrade
            -n "${{ steps.target.outputs.namespace }}"
            dittofeed-app deploy/helm-charts/dittofeed
            --set "image.tag=${{ steps.target.outputs.tag }}"
            --set "separateWorker.worker.image.tag=${{ steps.target.outputs.tag }}"
            --wait --timeout 15m
          )
          if [ -n "${{ steps.target.outputs.app_values }}" ]; then
            args+=(-f "${{ steps.target.outputs.app_values }}")
          fi
          helm "${args[@]}"
