name: Dittofeed CI/CD

on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Build and push Docker images to Harbor
        required: false
        default: false
        type: boolean

env:
  REGISTRY: harbor.hngcweywe.com
  IMAGE_PREFIX: harbor.hngcweywe.com/dittofeed

jobs:
  lint:
    name: Lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - api
          - worker
          - dashboard
          - admin-cli
          - isomorphic-lib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn

      - name: Emailo build
        run: yarn workspace emailo build

      - name: Run lint
        run: yarn workspace ${{ matrix.package }} lint

      - name: Run typecheck
        run: yarn workspace ${{ matrix.package }} check

  docker:
    name: Publish Docker image (${{ matrix.package }})
    if: inputs.publish_images == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - worker
          - api
          - dashboard
          - admin-cli
          - lite
    steps:
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: "robot$github-actions"
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set image tag from commit SHA
        id: image_tag
        run: echo "TAG=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/${{ matrix.package }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_PREFIX }}/dittofeed-${{ matrix.package }}:${{ steps.image_tag.outputs.TAG }}
          build-args: |
            APP_VERSION=${{ steps.image_tag.outputs.TAG }}
